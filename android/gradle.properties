# Memoria do Gradle. O valor anterior era 8G, mas esta maquina (WSL) tem
# 7G de RAM no total -- o build morria por falta de memoria. 2G e folgado
# para um app deste tamanho.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# Reaproveita o processo do Gradle entre builds (builds seguintes ficam
# bem mais rapidos).
org.gradle.daemon=true
org.gradle.parallel=true

android.useAndroidX=true
# Estes dois flags vieram do template do Flutter; nao mexa sem necessidade.
android.newDsl=false
android.builtInKotlin=false

# Compilacao incremental do Kotlin DESLIGADA.
#
# Com ela ligada, o build morre em `:shared_preferences_android:compileDebugKotlin`
# com "Could not close incremental caches ... class-fq-name-to-source.tab".
# O compilador nao consegue fechar os arquivos de cache que ele mesmo abriu --
# acontece quando o projeto vive num drive montado (D:\ visto do WSL) ou com um
# antivirus segurando os arquivos. Reproduzivel: falhou igual depois de um
# `flutter clean` completo.
#
# O custo e build seguinte mais lento (o Kotlin recompila os plugins inteiros
# em vez de so o que mudou). Sao poucos segundos num app deste tamanho, e nao
# afeta o APK gerado. Se um dia o projeto sair para um disco local de verdade,
# da para tentar remover esta linha.
kotlin.incremental=false
