# Memoria do Gradle. O valor anterior era 8G, mas esta maquina (WSL) tem
# 7G de RAM no total -- o build morria por falta de memoria. 2G e folgado
# para um app deste tamanho.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# Reaproveita o processo do Gradle entre builds (builds seguintes ficam
# bem mais rapidos).
org.gradle.daemon=true
org.gradle.parallel=true

android.useAndroidX=true
# Estes dois flags vieram do template do Flutter; nao mexa sem necessidade.
android.newDsl=false
android.builtInKotlin=false
