# Entrega continua do app via Shorebird.
#
# Todo push na main vira atualizacao para quem ja tem o app instalado:
#
#   - Se a `version:` do pubspec.yaml JA tem release no Shorebird, sobe um
#     PATCH: o codigo Dart novo viaja pela rede e o app se atualiza sozinho no
#     proximo abrir. Ninguem precisa instalar nada.
#
#   - Se a `version:` e nova (voce bumpou no pubspec.yaml), sobe um RELEASE:
#     compila um APK assinado, cria a release no GitHub com ele anexado, e
#     passa a ser a base dos patches seguintes.
#
# Patch nao consegue trocar codigo nativo (Kotlin, AndroidManifest, plugin
# novo, versao do Flutter). Quando voce mexer nisso, bumpe a version -- senao
# o passo de patch falha de proposito, avisando que precisa de release novo.
#
# Segredos necessarios (Settings > Secrets and variables > Actions):
#   SHOREBIRD_TOKEN           API key criada em console.shorebird.dev
#   ANDROID_KEYSTORE_BASE64   o robot-release.jks em base64
#   ANDROID_KEYSTORE_PASSWORD senha do keystore
#   ANDROID_KEY_ALIAS         alias da chave (robot)

name: Deploy

on:
  push:
    branches: [main]
    # Mudanca so de documentacao nao gera build.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

# Duas entregas ao mesmo tempo brigariam pelo mesmo release no Shorebird.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Necessario para criar a GitHub Release e anexar o APK.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Instala o CLI do Shorebird, que ja traz o Flutter dele junto --
      # por isso nao existe um setup-flutter aqui.
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          # O Shorebird baixa um Flutter inteiro; sem cache sao varios
          # minutos a cada push.
          cache: true

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 nao configurado." \
                 "Sem ele o APK sairia assinado com a chave de debug e nao" \
                 "instalaria por cima da versao que ja esta nos celulares."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/robot-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=robot-release.jks
          EOF

      - name: Decidir entre patch e release
        id: decide
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail

          # A linha `version: 1.0.0+1` do pubspec.yaml, sem o `version: `.
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::Nao consegui ler a version do pubspec.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A listagem vai para uma variavel ANTES de ser interpretada. Se
          # fosse direto num pipe, uma falha de rede viraria "lista vazia" e o
          # workflow concluiria que nao existe release -- disparando um build
          # completo por engano. Aqui uma falha e uma falha.
          if ! releases="$(shorebird releases list --platform android 2>&1)"; then
            echo "$releases"
            echo "::error::Nao consegui listar os releases do Shorebird." \
                 "Cheque o secret SHOREBIRD_TOKEN."
            exit 1
          fi
          echo "$releases"

          # Cada linha e: <id> <version> <plataformas> <flutter>
          # Se a nossa version aparecer na coluna 2, ja existe release para ela.
          if awk -v v="$version" '$2 == v { hit = 1 } END { exit !hit }' <<< "$releases"; then
            echo "Release $version ja existe -- entregando um patch."
            echo "mode=patch" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum release $version -- criando release novo."
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar patch (atualizacao OTA)
        if: steps.decide.outputs.mode == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          # Sem --allow-native-diffs / --allow-asset-diffs de proposito: se a
          # mudanca nao couber num patch, e melhor este passo falhar do que
          # entregar aos celulares um patch que quebra o app.
          shorebird patch \
            --platforms=android \
            --release-version="${{ steps.decide.outputs.version }}"

      - name: Compilar release (APK novo)
        if: steps.decide.outputs.mode == 'release'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          shorebird release \
            --platforms=android \
            --artifact=apk

      - name: Publicar o APK na GitHub Release
        if: steps.decide.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail

          # Caminho fixo do `shorebird release --artifact=apk`. O find e so
          # rede de seguranca caso uma versao futura mude o destino -- sem ele,
          # uma mudanca de caminho viraria uma release publicada sem APK.
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$apk" ]; then
            apk="$(find build -name '*-release.apk' -print -quit)"
          fi
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::Build terminou mas nenhum APK foi encontrado em build/."
            exit 1
          fi
          echo "APK: $apk"

          # Nome com a version dentro, para nao virar uma pilha de
          # "app-release.apk" indistinguiveis na pagina de releases.
          named="robot-controller-$VERSION.apk"
          cp "$apk" "$named"

          # O corpo da release vai por arquivo: escrever markdown de varias
          # linhas direto no --notes vira uma briga de aspas e indentacao.
          cat > /tmp/notes.md <<EOF
          APK assinado da versao \`$VERSION\`.

          Instale este APK **uma vez**. Dai em diante os pushes na \`main\` chegam
          sozinhos pelo Shorebird, sem reinstalar nada -- ate a proxima vez que
          a \`version\` do pubspec.yaml mudar.
          EOF

          gh release create "v$VERSION" "$named" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
